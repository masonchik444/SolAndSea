<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada — Doremi | Sol&amp;Sea</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --ink:#122029; --ink-soft:#3c4d55; --paper:#eef2f1; --paper-raised:#ffffff;
    --line:#d7dedb; --accent:#1c8a86;
    --wave-gradient: linear-gradient(160deg, #c0466b 0%, #e08a3f 32%, #1c8a86 68%, #1d4d84 100%);
    --shadow: 0 12px 32px -16px rgba(18,32,41,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#eef2f1; --ink-soft:#aab8bd; --paper:#0d1a20; --paper-raised:#132530;
           --line:#22383f; --accent:#3fb6ae; --shadow: 0 12px 36px -16px rgba(0,0,0,0.6); }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100svh; display:flex; align-items:center; justify-content:center; padding:32px;
    background:var(--paper); color:var(--ink);
    font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:520px; width:100%; text-align:center;
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:22px; padding:48px 36px; box-shadow:var(--shadow);
  }
  .mark{
    width:64px; height:64px; margin:0 auto 22px; border-radius:50%;
    background:var(--wave-gradient); display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:"Iowan Old Style",Georgia,serif; font-size:1.3rem; font-weight:700;
  }
  h1{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:1.7rem; font-weight:600; letter-spacing:-0.01em; margin:0 0 12px;
    overflow-wrap:break-word;
  }
  p{ margin:0 0 6px; line-height:1.6; color:var(--ink-soft); font-size:0.98rem; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; margin-top:26px;
    padding:12px 26px; border-radius:999px; text-decoration:none; font-weight:700;
    font-size:0.92rem; background:var(--wave-gradient); color:#fff; box-shadow:var(--shadow);
  }
  .contacts{ margin-top:24px; font-size:0.86rem; color:var(--ink-soft); }
  .contacts a{ color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">404</div>
    <h1>Página no encontrada</h1>
    <p>Esta página no existe o ha cambiado de dirección.</p>
    <p lang="en">This page does not exist or has moved.</p>
    <p lang="ru">Такой страницы нет или она переехала.</p>
    <a class="btn" href="/">Ir al inicio · Home · На главную</a>
    <div class="contacts">
      <a href="mailto:doremisolsea@gmail.com">doremisolsea@gmail.com</a> ·
      <a href="tel:+34613544024">+34 613 54 40 24</a>
    </div>
  </div>
</body>
</html>
